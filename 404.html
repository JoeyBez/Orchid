<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // Redirect all unknown routes to index.html
      // so React Router can handle them
      var path = location.pathname.replace(/\/$/, "");
      location.replace(
        location.origin + "/?redirect=" + encodeURIComponent(path)
      );
    </script>
  </head>
  <body></body>
</html>
